<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>F-H Route Comparison</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body { margin:0; font-family:sans-serif; }
#map { height:85vh; }
#info { padding:10px 15px; background:#f5f5f5; }
.legend { display:inline-block; width:20px; height:4px; vertical-align:middle; margin:0 5px; }
</style></head><body>
<div id="info">
<h3 style="margin:5px 0;">F → H Route Comparison</h3>
<p style="margin:5px 0;">
<span class="legend" style="background:#0000ff;"></span> Current PM F→H (29 pts)
<span class="legend" style="background:#ff0000;"></span> Proposed: AM 1→3 geometry (30 pts)
</p>
<p style="margin:5px 0; font-size:13px;">Max deviation: 14m — both on Ford Strathy Cres</p>
</div>
<div id="map"></div>
<script>
var pmSeg = [[43.505362, -79.705457], [43.505736, -79.706175], [43.506097, -79.706867], [43.506493, -79.707609], [43.506859, -79.708348], [43.507252, -79.709078], [43.507644, -79.709804], [43.50802, -79.710509], [43.508336, -79.711076], [43.508374, -79.711147], [43.508409, -79.711222], [43.508504, -79.711116], [43.509087, -79.71049], [43.509179, -79.710356], [43.509204, -79.710319], [43.508739, -79.709836], [43.508714, -79.709818], [43.508686, -79.709811], [43.508665, -79.709814], [43.508645, -79.709822], [43.508627, -79.709836], [43.508116, -79.710402], [43.50802, -79.710509], [43.506056, -79.712692], [43.506004, -79.712553], [43.505741, -79.711846], [43.50538, -79.710945], [43.505066, -79.710337], [43.504683, -79.709599]];
var amSeg = [[43.50536, -79.70546], [43.50574, -79.70618], [43.5061, -79.70687], [43.50649, -79.70761], [43.50686, -79.70835], [43.50725, -79.70908], [43.50764, -79.7098], [43.50802, -79.71051], [43.50812, -79.7104], [43.50841, -79.71008], [43.50863, -79.70984], [43.50865, -79.70982], [43.50867, -79.70981], [43.50869, -79.70981], [43.50871, -79.70982], [43.50874, -79.70984], [43.5092, -79.71032], [43.50909, -79.71049], [43.50854, -79.711077], [43.508504, -79.711116], [43.508409, -79.711222], [43.507691, -79.71199], [43.506532, -79.71315], [43.5063, -79.71338], [43.50606, -79.71269], [43.50574, -79.71185], [43.50538, -79.71094], [43.50507, -79.71034], [43.50468, -79.7096], [43.504675, -79.709608]];
var F = [43.50537, -79.70545];
var H = [43.50467, -79.7096];

var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

L.polyline(pmSeg, {color:'#0000ff', weight:6, opacity:0.7}).addTo(map)
  .bindPopup('Current PM F→H');
L.polyline(amSeg, {color:'#ff0000', weight:3, opacity:0.9, dashArray:'8,6'}).addTo(map)
  .bindPopup('Proposed: AM 1→3 geometry');

L.marker([F[0], F[1]]).addTo(map).bindPopup('<b>F</b> (= AM 1)<br>William Cutmore');
L.marker([H[0], H[1]]).addTo(map).bindPopup('<b>H</b> (= AM 3)<br>Meadowridge');

var bounds = L.latLngBounds(pmSeg.concat(amSeg).map(p => [p[0], p[1]]));
map.fitBounds(bounds.pad(0.2));
</script></body></html>
