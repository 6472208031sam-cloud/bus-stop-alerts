<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stop 6 preview</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap');
    :root {
      color-scheme: light dark;
      --bg: #f4f7f4;
      --surface: #ffffff;
      --surface-2: #eaf0ec;
      --surface-3: #dfe9e2;
      --text: #13211a;
      --muted: #53665b;
      --line: #cedbd2;
      --green: #087a4c;
      --green-strong: #04613b;
      --green-soft: #d9f1e5;
      --amber: #b25b09;
      --amber-soft: #fff0d9;
      --red: #b3342f;
      --red-soft: #fde8e6;
      --shadow: 0 16px 42px rgba(24, 48, 35, .10);
      --radius-lg: 22px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1714;
        --surface: #16231d;
        --surface-2: #1d2d25;
        --surface-3: #293d32;
        --text: #eef6f0;
        --muted: #afbeb5;
        --line: #35493d;
        --green: #49d492;
        --green-strong: #77e8ae;
        --green-soft: #183c2a;
        --amber: #ffc270;
        --amber-soft: #3a2b17;
        --red: #ff8f88;
        --red-soft: #412321;
        --shadow: 0 18px 50px rgba(0, 0, 0, .28);
      }
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito Sans", sans-serif;
      color: var(--text);
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--green-soft) 54%, var(--bg)) 0, var(--bg) 260px);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    svg { display: block; }
    .shell {
      width: min(100%, 1060px);
      margin: 0 auto;
      padding: 22px clamp(16px, 4vw, 36px) max(40px, env(safe-area-inset-bottom));
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      align-items: end;
      gap: 28px;
      padding: clamp(16px, 3vw, 30px) 0 26px;
    }
    h1, h2, h3 { font-family: "Archivo", sans-serif; margin: 0; letter-spacing: -.035em; }
    h1 { font-size: clamp(2.35rem, 7vw, 4.7rem); line-height: .98; max-width: 760px; }
    .hero p { margin: 14px 0 0; max-width: 580px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.16rem); line-height: 1.55; }
    .hero-note {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.5;
    }
    .hero-note strong { color: var(--text); display: block; margin-bottom: 3px; }
    .mode-switch {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      gap: 4px;
      background: var(--surface-2);
      border-radius: 12px;
      margin: 4px 0 18px;
    }
    .mode-btn {
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .mode-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .dashboard {
      display: grid;
      grid-template-columns: minmax(270px, .78fr) minmax(0, 1.22fr);
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .panel-head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
    .panel-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    h2 { font-size: 1.32rem; line-height: 1.2; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: .92rem; line-height: 1.45; }
    .badge { flex: none; padding: 6px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 700; }
    .route-panel { position: sticky; top: 16px; }
    .route-list { list-style: none; padding: 12px 16px 16px; margin: 0; }
    .route-item { position: relative; display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; min-height: 52px; }
    .route-item:not(:last-child)::after { content: ""; position: absolute; left: 17px; top: 36px; bottom: -16px; width: 2px; background: var(--line); }
    .dot { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 2px solid var(--line); font-family: "Archivo", sans-serif; font-size: .78rem; font-weight: 700; color: var(--muted); transition: .2s ease; }
    .route-item.configured .dot { background: var(--green-soft); border-color: var(--green); color: var(--green-strong); }
    .route-item.reached .dot { background: var(--green); border-color: var(--green); color: #fff; }
    .route-item.skipped .dot { background: var(--surface-3); border-color: var(--line); color: var(--muted); }
    .route-item.next .dot { outline: 4px solid var(--green-soft); }
    .stop-main { min-width: 0; }
    .stop-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stop-meta { font-size: .78rem; color: var(--muted); margin-top: 1px; }
    .stop-action { border: 0; background: transparent; color: var(--green-strong); padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .8rem; }
    .stop-action:hover { background: var(--green-soft); }
    a.stop-action { text-decoration: none; display: inline-block; }
    .workspace { min-width: 0; }
    .status-strip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
    .metric { background: var(--surface); padding: 16px 18px; min-width: 0; }
    .metric-label { color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .metric-value { margin-top: 4px; font-family: "Archivo", sans-serif; font-size: 1.04rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .content { padding: 22px; }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"] {
      width: 100%; min-height: 45px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); padding: 10px 12px; outline: none;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .field.full { grid-column: 1 / -1; }
    .coord-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .radius-row { display: flex; align-items: center; gap: 12px; }
    input[type="range"] { accent-color: var(--green); flex: 1; }
    output { font-weight: 700; min-width: 48px; text-align: right; }
    .action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .back-row[hidden] { display: none; }
    .back-row .sub { margin: 0; }
    .btn {
      min-height: 46px; border-radius: 11px; padding: 11px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.primary:hover { background: var(--green-strong); }
    .btn:disabled { opacity: .48; cursor: not-allowed; }
    .btn svg { width: 18px; height: 18px; }
    .notice { margin-top: 16px; padding: 13px 14px; border-radius: 11px; background: var(--amber-soft); color: var(--text); display: flex; gap: 10px; align-items: flex-start; font-size: .88rem; line-height: 1.45; }
    .notice svg { flex: none; margin-top: 1px; color: var(--amber); }
    .gps-help { margin: 18px 22px 0; padding: 16px; border-radius: 12px; background: var(--red-soft); border: 1px solid color-mix(in srgb, var(--red) 34%, transparent); }
    .gps-help[hidden] { display: none; }
    .gps-help-head { display: flex; gap: 10px; align-items: flex-start; }
    .gps-help-head svg { flex: none; color: var(--red); margin-top: 1px; }
    .gps-help strong { display: block; font-family: "Archivo", sans-serif; font-size: 1rem; }
    .gps-help p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.45; }
    .gps-help ol { margin: 12px 0 14px 28px; padding: 0; color: var(--text); font-size: .86rem; line-height: 1.55; }
    .gps-help .btn { min-height: 40px; padding: 8px 13px; border-color: color-mix(in srgb, var(--red) 38%, var(--line)); }
    .trip-view { display: none; }
    .trip-view.active, .setup-view.active { display: block; }
    .setup-view:not(.active) { display: none; }
    .trip-focus { text-align: center; padding: 10px 0 24px; }
    .pulse { width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green-strong); }
    .pulse.live { animation: breathe 2.2s ease-in-out infinite; }
    .pulse svg { width: 38px; height: 38px; }
    @keyframes breathe { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--green-soft) 50%, transparent); } }
    .trip-kicker { color: var(--muted); font-size: .84rem; font-weight: 700; }
    .next-stop { font-family: "Archivo", sans-serif; font-size: clamp(1.65rem, 5vw, 2.4rem); letter-spacing: -.035em; margin-top: 5px; }
    .distance { margin-top: 8px; color: var(--muted); }
    .progress-wrap { margin: 2px 0 20px; }
    .progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: .82rem; color: var(--muted); margin-bottom: 7px; }
    .track { height: 9px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: var(--green); transition: width .25s ease; }
    .secondary-tools { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; display: flex; flex-wrap: wrap; gap: 9px; }
    .small-btn { border: 0; background: var(--surface-2); color: var(--text); border-radius: 9px; padding: 9px 11px; font-size: .82rem; font-weight: 700; cursor: pointer; }
    .follower-card { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
    .follower-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .follower-head h3 { font-size: 1rem; margin: 0; letter-spacing: -.01em; }
    .follower-card .sub { font-size: .85rem; }
    .channel-row { display: flex; gap: 8px; margin-top: 10px; }
    .channel-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 9px; padding: 9px 10px; font-size: .78rem; font-family: ui-monospace, monospace; }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: var(--muted); opacity: .45; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch input:checked + .slider { background: var(--green); opacity: 1; }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .follow-card { display: none; }
    .follow-card.active { display: block; }
    .follow-flow { display: grid; gap: 0; margin-top: 8px; }
    .follow-step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
    .follow-step:last-child { border-bottom: 0; }
    .step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--green-soft); color: var(--green-strong); display: grid; place-items: center; font-weight: 800; }
    .follow-step h3 { font-size: 1rem; letter-spacing: -.01em; margin: 3px 0 5px; }
    .follow-step p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.48; }
    .offline-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: .8rem; font-weight: 700; }
    .toast { position: fixed; z-index: 20; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 18px); width: min(calc(100% - 32px), 470px); background: var(--text); color: var(--bg); border-radius: 12px; padding: 13px 16px; box-shadow: 0 14px 40px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .22s ease; font-weight: 700; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .alert-sheet { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 20px; background: rgba(5,15,10,.64); }
    .alert-sheet.open { display: grid; }
    .alert-card { width: min(100%, 430px); background: var(--surface); border-radius: 24px; padding: 28px; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,.36); }
    .arrival-mark { width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
    .arrival-mark svg { width: 36px; height: 36px; }
    .arrival-mark .stop-num { font-family: "Archivo", sans-serif; font-size: 2.5rem; font-weight: 800; line-height: 1; }
    .alert-card h2 { font-size: 2rem; }
    .alert-card p { color: var(--muted); margin: 8px 0 22px; }
    .file-input { display: none; }
    @media (max-width: 760px) {
      .shell { padding-top: 10px; }
      .hero { grid-template-columns: 1fr; gap: 15px; padding-top: 20px; }
      .hero-note { display: none; }
      .dashboard { grid-template-columns: 1fr; }
      .route-panel { position: static; order: 2; }
      .workspace { order: 1; }
      .route-list { display: grid; grid-template-columns: repeat(13, 1fr); gap: 0; padding: 16px 14px 20px; }
      .route-item { display: block; min-height: auto; text-align: center; }
      .route-item:not(:last-child)::after { left: 50%; right: -50%; top: 16px; bottom: auto; width: auto; height: 2px; }
      .dot { width: 32px; height: 32px; margin: 0 auto; font-size: .7rem; }
      .stop-main, .stop-action { display: none; }
      .panel-head.compact-mobile { padding-bottom: 10px; }
      .mode-switch { width: 100%; }
      .status-strip { grid-template-columns: 1fr 1fr; }
      .metric:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); }
      .setup-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .content { padding: 18px; }
      .gps-help { margin: 14px 18px 0; }
      .action-row .btn { flex: 1 1 140px; }
    }
    @media (max-width: 420px) {
      h1 { font-size: 2.5rem; }
      .route-list { padding-left: 9px; padding-right: 9px; }
      .dot { width: 29px; height: 29px; }
      .route-item:not(:last-child)::after { top: 14px; }
      .coord-row { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="alert-sheet open" id="alertSheet" role="dialog" aria-modal="true" aria-labelledby="arrivalTitle">
    <div class="alert-card">
      <div class="arrival-mark">
        <span class="stop-num" id="arrivalNumber">6</span>
      </div>
      <h2 id="arrivalTitle">Stop 6: ON WHEAT BOOM DR - OPPOSITE 434 WHEAT BOOM DR AT PARK reached</h2>
      <p id="arrivalText">Next up: Stop 7 &mdash; ON POSTRIDGE DR AT FAIRGATE WAY (N/W CORNER) - TRANSIT STYLE STOP.</p>
      <button class="btn primary" type="button" style="width:100%">Continue route</button>
    </div>
  </div>
</body>
</html>
