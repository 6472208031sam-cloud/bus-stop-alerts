L.polyline(routePath, {color:'#0b6e4f', weight:3, opacity:0.7}).addTo(map);
var colors = ['#eab308', '#f97316', '#ef4444'];
var labels = ['50m', '100m', '150m'];
stops.forEach(function(s) {
  L.marker([s.lat, s.lng], {
    icon: L.divIcon({className:'', html:'<div style="background:#22c55e;color:#fff;font-weight:bold;font-size:11px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);">'+s.n+'</div>', iconSize:[24,24], iconAnchor:[12,12]})
  }).bindPopup('<b>Stop '+s.n+'</b>').addTo(map);
});
checkpoints.forEach(function(cp) {
  var stopNum = stops[cp.stop_idx].n;
  L.circleMarker([cp.lat, cp.lng], {
    radius: 6, fillColor: colors[cp.seq], color: '#fff', weight: 1, fillOpacity: 0.9
  }).bindPopup('<b>Stop '+stopNum+' → '+labels[cp.seq]+'</b><br>Checkpoint '+(cp.seq+1)+' of 3').addTo(map);
});
</script></body></html>
