<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PM Bus Route</title>
<script>
  // The Bus app is now a single tabbed page (v4.0). Redirect to the PM tab.
  (function () {
    try {
      localStorage.setItem('bus_dir', 'pm');
      localStorage.setItem('bus_dir_day', new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date()));
    } catch (e) {}
    location.replace('index.html');
  })();
</script>
</head>
<body>
<p>Redirecting to the Bus app… <a href="index.html">Continue</a></p>
</body>
</html>
